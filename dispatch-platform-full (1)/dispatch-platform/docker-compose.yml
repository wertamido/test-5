version: '3.9'

services:
  # ─── PostgreSQL Database ───────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: freight-postgres
    environment:
      POSTGRES_DB: freight_dispatch
      POSTGRES_USER: freight
      POSTGRES_PASSWORD: ${DB_PASSWORD:-freight_secure_2024}
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U freight -d freight_dispatch']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - freight-network
    restart: unless-stopped

  # ─── Redis (Cache + WebSocket pub/sub) ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: freight-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secure_2024} --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-redis_secure_2024}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - freight-network
    restart: unless-stopped

  # ─── API Server ────────────────────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: freight-server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://freight:${DB_PASSWORD:-freight_secure_2024}@postgres:5432/freight_dispatch
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_2024}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-too}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:19006}
    ports:
      - '3001:3001'
    networks:
      - freight-network
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

  # ─── Nginx Reverse Proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: freight-nginx
    depends_on:
      - server
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certificates:/etc/nginx/certificates:ro
    networks:
      - freight-network
    restart: unless-stopped

  # ─── Adminer (DB Management UI - dev only) ────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: freight-adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - '8080:8080'
    networks:
      - freight-network
    restart: unless-stopped
    profiles:
      - dev

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  freight-network:
    driver: bridge
